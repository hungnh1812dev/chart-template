{{- include "chart.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
    spec:
      {{- if .Values.initContainers.enabled }}
      {{- /* Copy each item so the Secret can be appended without mutating .Values. */}}
      {{- $initContainers := list }}
      {{- range .Values.initContainers.containers }}
      {{- $c := deepCopy . }}
      {{- if $.Values.secrets.enabled }}
      {{- $_ := set $c "envFrom" (append ($c.envFrom | default list) (dict "secretRef" (dict "name" (include "chart.secretName" $)))) }}
      {{- end }}
      {{- $initContainers = append $initContainers $c }}
      {{- end }}
      initContainers:
        {{- toYaml $initContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.serviceName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.appPort }}
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.secrets.enabled }}
          envFrom:
            - secretRef:
                name: {{ include "chart.secretName" . }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
