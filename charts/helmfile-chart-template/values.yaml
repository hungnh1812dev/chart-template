# Required inputs. Full names are derived from these:
#   namespace:    <appNamespace>-<appEnv>
#   service name: <appName>-<serviceName>-<appEnv>
appName: ""
serviceName: ""
appNamespace: ""
appEnv: ""
appPort: 8080

image:
  repository: ""   # required
  tag: ""          # required
  pullPolicy: Always

replicaCount: 1
resources: {}
env: []            # extra container env vars, e.g. [{name: FOO, value: bar}]

initContainers:
  enabled: false   # set true to render spec.template.spec.initContainers
  containers: []   # plain Kubernetes container specs, e.g.
  # - name: migrate
  #   image: ghcr.io/acme/shop-api:1.2.3
  #   command: ["./migrate", "up"]

secrets:
  enabled: false   # set true to load Secret <appName>-<serviceName>-secrets-<appEnv>
                   # into the app container and all init containers via envFrom.
                   # The Secret must already exist in <appNamespace>-<appEnv>.

probes:
  enabled: false   # set true to add liveness + readiness httpGet probes on appPort (port "http")
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 3
