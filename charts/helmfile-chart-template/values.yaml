# Required inputs. Full names are derived from these:
#   namespace:    <appNamespace>-<appEnv>
#   service name: <appName>-<serviceName>-<appEnv>
appName: ""
serviceName: ""
appNamespace: ""
appEnv: ""
appPort: 8080

image:
  repository: ""   # required
  tag: ""          # required
  pullPolicy: IfNotPresent

replicaCount: 1
resources: {}
env: []            # extra container env vars, e.g. [{name: FOO, value: bar}]

initContainers:
  enabled: false   # set true to render spec.template.spec.initContainers
  containers: []   # plain Kubernetes container specs, e.g.
  # - name: migrate
  #   image: ghcr.io/acme/shop-api:1.2.3
  #   command: ["./migrate", "up"]
