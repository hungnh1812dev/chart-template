---
# Source: helmfile-chart-template/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: shop-api-dev
  namespace: shop-dev
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: shop
    environment: dev
    app.kubernetes.io/instance: shop-api-dev
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/instance: shop-api-dev

---
# Source: helmfile-chart-template/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api-dev
  namespace: shop-dev
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: shop
    environment: dev
    app.kubernetes.io/instance: shop-api-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: shop-api-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: shop
        environment: dev
        app.kubernetes.io/instance: shop-api-dev
    spec:
      containers:
        - name: api
          image: "ghcr.io/acme/shop-api:1.2.3"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
